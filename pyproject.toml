[project]
name = "vyvid"
version = "0.2.34"
description = "Вивід: what a coding agent needs to know before it acts, scoped to the folder it is in"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["platformdirs>=4,<5", "numpy>=1.24,<3", "onnxruntime>=1.20,<2", "tokenizers>=0.20,<1", "pyoxigraph==0.5.13", "regex==2026.9.29", "tomlkit==0.15.2", "pyyaml==6.0.3"]

[project.optional-dependencies]
symbols = ["tree-sitter==0.26.0", "tree-sitter-python==0.25.0", "tree-sitter-haskell==0.24.1", "tree-sitter-java==0.23.5", "tree-sitter-typescript==0.23.2"]
test = ["pytest>=8", "pytest-xdist==3.8.0", "vyvid[symbols]"]

[project.scripts]
vyd = "vyvid.cli:run"
vyd-hook = "vyvid.remind:run"

[project.entry-points."vyvid.extractors"]
owl-terms = "vyvid.extractors.owl:extract"
quanta = "vyvid.extractors.quanta:extract"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vyvid"]

[tool.pytest.ini_options]
markers = ["real_trust: use the real decision on whether a configuration is trusted, which the suite otherwise grants"]
