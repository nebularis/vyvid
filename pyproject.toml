[project]
name = "vyvid"
version = "0.1.0"
description = "Вивід: what a coding agent needs to know before it acts, scoped to the folder it is in"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["platformdirs>=4,<5", "numpy>=1.24,<3", "onnxruntime>=1.20,<2", "tokenizers>=0.20,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vyd = "vyvid.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vyvid"]
