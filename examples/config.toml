# An example configuration. Copy it to the path `vyd config` prints, or point VYVID_CONFIG at it.

[framework]
kb = "~/work/vyvid/kb"
# Appended to every message that `vyd kb record` commits.
commit_trailers = ["Co-Authored-By: Your Agent <agent@example.com>"]
# "stop" means vyd never runs glue itself. It prints each glue command for your client to run, and nothing else overrides it.
# glue = "stop"
# Set to false to write no log of the questions asked.
# logs = false
# doc_share = 0.4          # the most of `find --kind symbol`'s places documentation may take, 0 to 1. A project may set its own

[general]
rules = "kb:general/rules.md"
skills = "kb:general/skills"

[[domains]]
name = "software-engineering"
visibility = "public"
trust = "own"

[[domains]]
name = "owl"
visibility = "public"
trust = "own"
path = "~/work/vyvid/examples/domains/owl"

[[domains]]
name = "triple-stores"
visibility = "public"
trust = "own"
parents = ["software-engineering", "owl"]

[[domains]]
name = "tools"
visibility = "public"
# A domain with a remote gives knowledge alone unless you say otherwise. "own" is yours, and "reviewed" needs the commit you read:
# trust = "reviewed"
# commit = "3f9c2ab"
trust = "own"
parents = ["software-engineering"]
families = { NOTE = {} }
remote = "git@github.com:nebularis/vyvid-tools.git"
git = { pull = "daily", commit = "auto", push = "auto" }

[[projects]]
name = "lattice"
visibility = "public"
code = "~/work/lattice"
match = { remote = "github.com/nebularis/lattice" }
docs = "code:docs"
contract = ["code:AGENTS.md"]
skills = ["code:.claude/skills"]
domains = ["owl", "triple-stores", "tools"]
specialises = { tools = "docs:developer/tools.md" }

[projects.families]
STD = { defined = "docs:developer/standards.md", type = "standard" }
PRI = { defined = "docs:developer/principles.md", type = "principle" }
CAP = { defined = "docs:developer/capabilities.md", type = "capability" }
TD = { defined = "docs:developer/technical-debt.md", type = "debt" }
PDD = { defined = "docs:developer/pending-design-decisions.md", type = "pending-decision" }
TSD = { pattern = 'TSD-\d+[a-z]?', defined = "docs:architecture/triple-store-discovery.md" }
ADR = { pattern = 'ADR-A-?[A-Za-z]{0,4}-?\d+[a-z]?', defined = "docs:architecture/decisions/" }

# For `vyd check identifiers`. An unresolved mention of a family with `removable = true` is reported and never failed, since the entry is
# meant to disappear. `exceptions` lists identifiers mentioned and defined nowhere, one per line with a reason after `#`. `defined_only = true`
# reads a bare match of a loose pattern as a mention only where the family's source defines it, so `UTF-8` is not read as a slice.
# TD = { defined = "docs:developer/technical-debt.md", type = "debt", removable = true }
# SL = { pattern = '[A-Z][A-Z0-9]*-\d[\w.]*', defined = "docs:developer/status/*.md", type = "slice", defined_only = true, exceptions = "docs:developer/slice-exceptions.txt" }
#
# [projects.identifiers]
# exceptions = "docs:developer/identifier-exceptions.txt"   # one baseline for every family of the project
# skip = ["slice-crosswalk-*"]                                # tracked files to leave out, by glob on the path or the name
# generated = '\A\{% comment %\}Copied from'                  # a file whose first 200 characters match is a generated copy

[projects.uses.owl.owl-terms]
paths = ["code:ontology/**/*.ttl"]

# What the project gave to a domain, so its mentions resolve there with no rewriting of its text.
# A whole family resolves a bare TSD-42 to triple-stores:TSD-42. The project's own definition of the family may stay until its copy is removed.
# [[projects.moves]]
# family = "TSD"
# to = "triple-stores"
# source = "code:docs/architecture/triple-store-discovery.md"
# commit = "4b94c0f0"
#
# Some rows of a family that stays, each to its identifier in the domain, so STD-030 resolves to triple-stores:RDF-5.
# [[projects.moves]]
# family = "STD"
# to = "triple-stores"
# source = "code:docs/developer/standards.md"
# commit = "4b94c0f0"
# rows = { "STD-030" = "RDF-5", "STD-031" = "RDF-6" }

[[projects.recipes]]
name = "sparql-for-studio"
description = "When writing or generating SPARQL for the studio"
steps = [
  { step = "find", words = "{question}", kind = "standard", activity = "query-writing", tech = "sparql", limit = 6 },
  { step = "linked", edges = ["decidedBy", "supports"], direction = "out" },
  { step = "include", ids = ["CAP-52"] },
  { step = "take", n = 3, per_kind = true },
]

# A project may keep its documents outside its code. `docs` outside `code` is private unless `docs_visibility = "public"`, an entry defined there is
# labelled private, and `vyd check citations` refuses a line of the code repository that cites it. `git.docs` is for `vyd docs record`, and a vyvid.toml may not set it.
# [[projects]]
# name = "contribution"
# code = "~/work/contribution"
# docs = "~/work/contribution-documents"
# contract = "docs:CONTRACT.md"
# match = { remote = ["github.com/example/contribution"] }
# domains = ["tools"]
# git = { docs = { commit = "manual", push = "manual" } }
# [projects.families]
# SL = { defined = "docs:INDEX.md", type = "slice" }
#
# A repository can declare its own project in a vyvid.toml at its root, with no entry here. This repository does, so its families are
# the file's. An entry here with the same name and the same code folder overrides the file's keys one by one, and a family set here
# replaces all of the file's. `vyd trust`, run in the repository, lets the file's glue and command extractors run.
