# An example configuration. Copy it to the path `vyd config` prints, or point VYVID_CONFIG at it.

[framework]
kb = "~/work/vyvid/kb"
# Appended to every message that `vyd kb record` commits.
commit_trailers = ["Co-Authored-By: Your Agent <agent@example.com>"]
# "stop" means vyd never runs glue itself. It prints each glue command for your client to run, and nothing else overrides it.
# glue = "stop"

[general]
rules = "kb:general/rules.md"
skills = "kb:general/skills"

[[domains]]
name = "software-engineering"
visibility = "public"

[[domains]]
name = "owl"
visibility = "public"
path = "~/work/vyvid/examples/domains/owl"

[[domains]]
name = "triple-stores"
visibility = "public"
parents = ["software-engineering", "owl"]

[[domains]]
name = "tools"
visibility = "public"
parents = ["software-engineering"]
families = { NOTE = {} }
remote = "git@github.com:nebularis/vyvid-tools.git"
git = { pull = "daily", commit = "auto", push = "auto" }

[[projects]]
name = "lattice"
visibility = "public"
code = "~/work/lattice"
match = { remote = "github.com/nebularis/lattice" }
docs = "code:docs"
contract = ["code:AGENTS.md"]
skills = ["code:.claude/skills"]
domains = ["owl", "triple-stores", "tools"]
specialises = { tools = "docs:developer/tools.md" }

[projects.families]
STD = { defined = "docs:developer/standards.md", type = "standard" }
PRI = { defined = "docs:developer/principles.md", type = "principle" }
CAP = { defined = "docs:developer/capabilities.md", type = "capability" }
TD = { defined = "docs:developer/technical-debt.md", type = "debt" }
PDD = { defined = "docs:developer/pending-design-decisions.md", type = "pending-decision" }
TSD = { pattern = 'TSD-\d+[a-z]?', defined = "docs:architecture/triple-store-discovery.md" }
ADR = { pattern = 'ADR-A-?[A-Za-z]{0,4}-?\d+[a-z]?', defined = "docs:architecture/decisions/" }

[projects.uses.owl.owl-terms]
paths = ["code:ontology/**/*.ttl"]

[[projects.recipes]]
name = "sparql-for-studio"
description = "When writing or generating SPARQL for the studio"
steps = [
  { step = "find", words = "{question}", kind = "standard", activity = "query-writing", tech = "sparql", limit = 6 },
  { step = "linked", edges = ["decidedBy", "supports"], direction = "out" },
  { step = "include", ids = ["CAP-52"] },
  { step = "take", n = 3, per_kind = true },
]

[[projects]]
name = "vyvid"
visibility = "public"
code = "~/work/vyvid"
match = { remote = "github.com/nebularis/vyvid" }
docs = "code:docs"
domains = ["software-engineering", "tools"]
facets = ["docs:developer/facets.md"]

[projects.families]
STD = { defined = "docs:developer/standards.md", type = "standard" }
PRI = { defined = "docs:developer/principles.md", type = "principle" }
CAP = { defined = "docs:developer/capabilities.md", type = "capability" }
ADR = { pattern = 'ADR-\d{3}', defined = "docs:architecture/decisions/" }
