# mise is the only task entry point, as in LATTICE.
[tools]
python = "3.14.7"
uv = "0.13.4"

[tasks.check]
description = "Every check: the tests, the writing and publication rules, the identifiers and the links"
depends = ["check:tests", "check:writing", "check:identifiers", "check:links"]

[tasks."check:tests"]
description = "Run the test suite"
run = "uv run --extra test pytest -q -n auto"

[tasks."check:writing"]
description = "Check the writing rules on every Markdown file, and the publication rules on user-facing text (STD-3, STD-4, STD-14, STD-15)"
run = "uv run python tools/check_writing.py"

[tasks."check:identifiers"]
description = "Fail on an identifier the tracked Markdown mentions and nothing defines, or one a family defines twice (vyvid.toml declares the families)"
run = "uv run vyd check identifiers ."

[tasks."check:links"]
description = "Fail on a backlink in code that no register defines, or a pointer of an entry that names a file or line that is not there"
run = "uv run vyd check links ."

[tasks."bench:lattice"]
description = "Score find against LATTICE's own on its bake-off questions, never part of check: mise run bench:lattice -- --config <configuration>"
run = "uv run python benchmark/lattice-bakeoff/bench.py"

[tasks."bench:symbols"]
description = "Score the ways to rank symbols on fixed questions, never part of check: mise run bench:symbols -- --config <configuration>"
run = "uv run --extra symbols python benchmark/symbols/bench.py"

[tasks."bench:mechanical"]
description = "Score find --kind symbol on questions generated from ast, by name, by meaning and by module, never part of check: mise run bench:mechanical -- --config <configuration>"
run = "uv run --extra symbols python benchmark/symbols/mechanical.py"

[tasks.install]
description = "Install vyvid as a tool, editable, so vyd runs the working tree"
run = "uv tool install --editable --force ."

[tasks.context]
description = "Print the resolved contract for a folder: mise run context -- <folder>"
run = "uv run vyd context"
