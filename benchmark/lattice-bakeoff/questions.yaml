# Bake-off question set, second draft, mapped by hand against every entry of the index (580).
#
# Each question is an agent's words, written to avoid each entry's own wording where it can.
# expect: an answer that must be in the top 5 (counted for recall@5, and the best-ranked one for MRR)
# accept: also a right answer, counted for MRR only, never a miss if it is absent
# kind:   paraphrase (the words differ), keyword (the agent uses the term), negative (nothing should match,
#         to set the score below which an empty answer means a real absence)
#
# Facets are not tagged yet, so each question is ranked over all 580 entries, the harder case.
# Q01 and Q02 are the maintainer's. MEC-35 was in both lists of Q01, and is now in expect only.

